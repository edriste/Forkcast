    <text x="80" y="77" fill="#FFAB63" font-size="13" font-weight="700" letter-spacing="3.4">THE TEAM LUNCH COMPANION</text>
    <text x="76" y="160" fill="#FF9C46" font-size="76" font-weight="800" letter-spacing="-3">Forkcast</text>
    <text x="80" y="237" fill="#FFF9F1" font-size="43" font-weight="700" letter-spacing="-1.2">Good lunch.</text>
    <text x="80" y="292" fill="#FFF9F1" font-size="43" font-weight="700" letter-spacing="-1.2">Great company.</text>
    <text x="82" y="365" fill="#CDBFB4" font-size="19">Find a spot. Cook together. Order in.</text>
  </g>
