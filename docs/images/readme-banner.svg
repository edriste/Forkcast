<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Forkcast — Good lunch. Great company.</title>
  <desc id="desc">An orange fork-shaped location pin beside the Forkcast wordmark on a warm charcoal background.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#211C18"/><stop offset="1" stop-color="#37251D"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#FF641D"/><stop offset="1" stop-color="#FFBA54"/></linearGradient>
    <linearGradient id="pin" x2=".8" y2="1"><stop stop-color="#FFFAEF"/><stop offset="1" stop-color="#FFE3C7"/></linearGradient>
  </defs>
  <rect width="1280" height="440" rx="28" fill="url(#bg)"/>
  <circle cx="1125" cy="116" r="285" fill="#FF8A24" opacity=".055"/>
  <circle cx="1125" cy="116" r="218" fill="none" stroke="#FFAA55" stroke-opacity=".12"/>
