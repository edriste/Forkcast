server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location = /healthz { access_log off; return 200 'ok'; }
  location = /runtime-config.js {
    add_header Cache-Control 'no-store' always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  location = /service-worker.js { add_header Cache-Control 'no-cache' always; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control 'no-cache' always; try_files $uri =404; }
  location = /index.html { add_header Cache-Control 'no-cache' always; }
  location = /version.json { add_header Cache-Control 'no-store' always; try_files $uri =404; }
  location /_expo/ { try_files $uri =404; expires 1y; add_header Cache-Control 'public, immutable'; }
  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control 'public, immutable'; }
  location ~ /\. { deny all; }
  # Google/PKCE callbacks and application routes must reach the SPA.
  location / { try_files $uri $uri/ /index.html; }
}
