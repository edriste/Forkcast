map $uri $forkcast_cache_control {
  default no-cache;
  /runtime-config.js no-store;
  /version.json no-store;
  ~^/(_expo|assets)/ "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Set headers once so child locations retain the security headers as well.
  add_header Cache-Control $forkcast_cache_control;

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  # Required assets must return 404 rather than the SPA when missing.
  location ~ ^/(runtime-config\.js|version\.json|service-worker\.js|manifest\.webmanifest)$ {
    try_files $uri =404;
  }
  location /_expo/ {
    try_files $uri =404;
  }
  location /assets/ {
    try_files $uri =404;
  }
  location ~ /\. {
    deny all;
  }

  # Google/PKCE callbacks and application routes must reach the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
