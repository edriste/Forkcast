project_id = "forkcast"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["forkcast://auth", "http://localhost:8081", "http://127.0.0.1:8081"]
enable_signup = true
minimum_password_length = 8

# Enable after exporting the server-only credentials before starting Supabase.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Your Forkcast verification code"
content_path = "./supabase/templates/confirmation.html"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[functions.places]
# Authenticated manually inside the function, including asymmetric JWTs.
verify_jwt = false
